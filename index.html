<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Современная веб-платформа для создания и управления диаграммами Ганта">
    <meta name="keywords" content="gantt, диаграмма ганта, управление проектами, планирование">
    <meta name="author" content="Gantt Platform">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Gantt Chart Platform - Создание диаграмм Ганта</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/gantt.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1><i class="fas fa-chart-gantt"></i> Gantt Platform</h1>
            </div>
            <div class="header-center">
                <div class="project-info">
                    <span id="project-name">Новый проект</span>
                    <button id="rename-project" class="btn-icon" title="Переименовать проект">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            </div>
            <div class="header-right">
                <button id="new-project" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Новый проект
                </button>
                <button id="open-project" class="btn btn-secondary">
                    <i class="fas fa-folder-open"></i> Открыть
                </button>
                <button id="save-project" class="btn btn-success">
                    <i class="fas fa-save"></i> Сохранить
                </button>
                <button id="export-project" class="btn btn-info">
                    <i class="fas fa-download"></i> Экспорт
                </button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-section">
                <button id="add-task" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить задачу
                </button>
                <button id="delete-task" class="btn btn-danger" disabled>
                    <i class="fas fa-trash"></i> Удалить
                </button>
                <button id="edit-task" class="btn btn-warning" disabled>
                    <i class="fas fa-edit"></i> Редактировать
                </button>
            </div>
            
            <div class="toolbar-section">
                <label for="zoom-level">Масштаб:</label>
                <select id="zoom-level">
                    <option value="days">Дни</option>
                    <option value="weeks" selected>Недели</option>
                    <option value="months">Месяцы</option>
                    <option value="quarters">Кварталы</option>
                </select>
            </div>

            <div class="toolbar-section">
                <button id="today-btn" class="btn btn-secondary">
                    <i class="fas fa-calendar-day"></i> Сегодня
                </button>
                <button id="fit-to-screen" class="btn btn-secondary">
                    <i class="fas fa-expand-arrows-alt"></i> По размеру
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Task Panel -->
            <div class="task-panel">
                <div class="panel-header">
                    <h3>Задачи</h3>
                    <div class="panel-controls">
                        <button id="collapse-all" class="btn-icon" title="Свернуть все">
                            <i class="fas fa-compress-alt"></i>
                        </button>
                        <button id="expand-all" class="btn-icon" title="Развернуть все">
                            <i class="fas fa-expand-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="task-list" id="task-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>

            <!-- Gantt Chart Area -->
            <div class="gantt-container">
                <div class="gantt-header">
                    <div class="gantt-timeline" id="gantt-timeline">
                        <!-- Timeline will be generated dynamically -->
                    </div>
                </div>
                <div class="gantt-body">
                    <div class="gantt-grid" id="gantt-grid">
                        <!-- Grid will be generated dynamically -->
                    </div>
                    <div class="gantt-bars" id="gantt-bars">
                        <!-- Task bars will be generated dynamically -->
                    </div>
                    <div class="gantt-dependencies" id="gantt-dependencies">
                        <!-- Dependencies will be generated dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span id="selected-task-info">Выберите задачу для просмотра информации</span>
            </div>
            <div class="status-right">
                <span id="project-stats">Задач: 0 | Завершено: 0</span>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Новая задача</h2>
                <button class="modal-close" id="close-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-name">Название задачи:</label>
                        <input type="text" id="task-name" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="start-date">Дата начала:</label>
                            <input type="date" id="start-date" required>
                        </div>
                        <div class="form-group">
                            <label for="end-date">Дата окончания:</label>
                            <input type="date" id="end-date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-duration">Длительность (дни):</label>
                        <input type="number" id="task-duration" min="1" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-progress">Прогресс (%):</label>
                            <input type="range" id="task-progress" min="0" max="100" value="0">
                            <span id="progress-value">0%</span>
                        </div>
                        <div class="form-group">
                            <label for="task-priority">Приоритет:</label>
                            <select id="task-priority">
                                <option value="low">Низкий</option>
                                <option value="medium" selected>Средний</option>
                                <option value="high">Высокий</option>
                                <option value="critical">Критический</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-dependencies">Зависимости (ID задач через запятую):</label>
                        <input type="text" id="task-dependencies" placeholder="1,3,5">
                    </div>
                    <div class="form-group">
                        <label for="task-assignee">Исполнитель:</label>
                        <input type="text" id="task-assignee" placeholder="Введите имя исполнителя">
                    </div>
                    <div class="form-group">
                        <label for="task-description">Описание:</label>
                        <textarea id="task-description" rows="3" placeholder="Описание задачи..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancel-task" class="btn btn-secondary">Отмена</button>
                <button type="button" id="save-task" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- File Input for Import -->
    <input type="file" id="file-input" accept=".json,.csv" style="display: none;">

    <!-- Scripts -->
    <script src="js/polyfills.js"></script>
    <script src="js/browser-check.js"></script>
    <script>
        // Check if ES6 classes are supported, if not use ES5 version
        if (typeof Symbol === 'undefined' || !window.Map || !window.Set) {
            document.write('<script src="js/utils-es5.js"><\/script>');
            document.write('<script src="js/data-manager-es5.js"><\/script>');
            document.write('<script src="js/gantt-chart-es5.js"><\/script>');
            document.write('<script src="js/task-manager-es5.js"><\/script>');
            document.write('<script src="js/ui-manager-es5.js"><\/script>');
            document.write('<script src="js/app-es5.js"><\/script>');
        } else {
            document.write('<script src="js/utils.js"><\/script>');
            document.write('<script src="js/data-manager.js"><\/script>');
            document.write('<script src="js/gantt-chart.js"><\/script>');
            document.write('<script src="js/task-manager.js"><\/script>');
            document.write('<script src="js/ui-manager.js"><\/script>');
            document.write('<script src="js/app.js"><\/script>');
        }
    </script>
</body>
</html>
